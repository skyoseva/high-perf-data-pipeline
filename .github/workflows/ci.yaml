name: C++ & Python Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ build-essential pybind11-dev python3-pybind11

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest duckdb pybind11

    - name: Build C++ module
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        cmake --build .

    - name: Verify compiled module location
      run: ls -la cpp_processor*.so

    - name: Run Pytest
      run: |
        pwd
        ls -la
        export PYTHONPATH=$PWD
        python3 -c "import sys; print('\n'.join(sys.path))"
        pytest -v